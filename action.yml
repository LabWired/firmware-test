name: "LabWired"
description: "Run firmware simulation tests in CI — no hardware, no toolchain."
branding:
  icon: "cpu"
  color: "purple"

inputs:
  script:
    description: "Path to the LabWired test script YAML."
    required: true
  firmware:
    description: "Optional path to firmware ELF (overrides script inputs)."
    required: false
    default: ""
  system:
    description: "Optional path to system manifest YAML (overrides script inputs)."
    required: false
    default: ""
  output_dir:
    description: "Directory to write artifacts (result.json, uart.log, junit.xml)."
    required: false
    default: "out/artifacts"
  version:
    description: "LabWired CLI release tag to install."
    required: false
    default: "v0.18.0"
  gallery:
    description: >
      List this repository in the public LabWired gallery at
      https://app.labwired.com/ci. Set to "false" to keep runs unlisted.
    required: false
    default: "true"
  comment:
    description: "Post a results comment on the pull request."
    required: false
    default: "true"
  api-url:
    description: "LabWired API base URL. Override only for testing."
    required: false
    default: "https://api.labwired.com"

outputs:
  status:
    description: "pass, fail, error, or unknown."
    value: ${{ steps.summary.outputs.status }}
  report_url:
    description: "Hosted report URL, empty if the upload did not happen."
    value: ${{ steps.upload.outputs.report_url }}
  artifacts_dir:
    description: "Directory containing result.json / uart.log / junit.xml."
    value: ${{ inputs.output_dir }}

runs:
  using: "composite"
  steps:
    - name: Install LabWired CLI
      id: install
      shell: bash
      env:
        LABWIRED_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        version="$LABWIRED_VERSION"

        if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::The version input must be an immutable LabWired CLI release tag in vMAJOR.MINOR.PATCH form, such as v0.18.0."
          exit 1
        fi

        case "${{ runner.os }}/${{ runner.arch }}" in
          Linux/X64)   platform="linux-x86_64" ;;
          Linux/ARM64) platform="linux-aarch64" ;;
          macOS/X64)   platform="darwin-x86_64" ;;
          macOS/ARM64) platform="darwin-aarch64" ;;
          *)
            echo "::error::Unsupported GitHub Actions runner platform: ${{ runner.os }}/${{ runner.arch }}."
            exit 1
            ;;
        esac

        temp_dir="$(mktemp -d "$RUNNER_TEMP/labwired-${version}-${platform}.XXXXXX")"
        archive="$temp_dir/labwired.tar.gz"
        extract_dir="$temp_dir/extract"
        bin_dir="$RUNNER_TEMP/labwired-bin/${version}/${platform}"
        url="https://github.com/w1ne/labwired-core/releases/download/${version}/labwired-${version}-${platform}.tar.gz"

        mkdir -p "$extract_dir" "$bin_dir"
        curl --fail --location --retry 3 --retry-delay 2 --output "$archive" "$url"
        tar -xzf "$archive" -C "$extract_dir"

        candidate="$(find "$extract_dir" -type f -name labwired -print -quit)"
        if ! test -x "$candidate"; then
          echo "::error::Released LabWired archive did not contain an executable named labwired for $platform."
          exit 1
        fi

        install -m 0755 "$candidate" "$bin_dir/labwired"
        echo "bin=$bin_dir/labwired" >> "$GITHUB_OUTPUT"
        echo "$bin_dir" >> "$GITHUB_PATH"

    - name: Run labwired test
      id: run
      shell: bash
      env:
        LABWIRED_SCRIPT: ${{ inputs.script }}
        LABWIRED_OUTPUT_DIR: ${{ inputs.output_dir }}
        LABWIRED_FIRMWARE: ${{ inputs.firmware }}
        LABWIRED_SYSTEM: ${{ inputs.system }}
      run: |
        set -euo pipefail
        out="$LABWIRED_OUTPUT_DIR"
        mkdir -p "$out"
        bin="${{ steps.install.outputs.bin }}"

        args=(test --script "$LABWIRED_SCRIPT" --output-dir "$out" --no-uart-stdout)
        if [ -n "$LABWIRED_FIRMWARE" ]; then args+=(--firmware "$LABWIRED_FIRMWARE"); fi
        if [ -n "$LABWIRED_SYSTEM" ]; then args+=(--system "$LABWIRED_SYSTEM"); fi

        set +e
        "$bin" "${args[@]}"
        code=$?
        set -e
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Request OIDC token
      id: oidc
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
      # Best-effort by contract: nothing in this step may ever fail the
      # maintainer's build, so it is deliberately NOT `set -e`. A transient
      # 5xx, a timeout, or an unexpected token-endpoint body must degrade to
      # "no hosted report" rather than redden a build whose firmware tests
      # all passed.
      run: |
        set -uo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::warning::No OIDC token available. Add 'permissions: id-token: write' to this job to get a hosted LabWired report."
          echo "token=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        token="$(curl --fail --silent --retry 3 \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${API_URL}" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' 2>/dev/null)"
        if [ -z "$token" ]; then
          echo "::warning::Could not obtain an OIDC token (network error or unexpected response). Continuing without a hosted LabWired report."
          echo "token=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Upload run to LabWired
      id: upload
      shell: bash
      env:
        LABWIRED_OUTPUT_DIR: ${{ inputs.output_dir }}
        LABWIRED_API_URL: ${{ inputs.api-url }}
        LABWIRED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        LABWIRED_GALLERY: ${{ inputs.gallery }}
        LABWIRED_FIRMWARE: ${{ inputs.firmware }}
        LABWIRED_SYSTEM: ${{ inputs.system }}
        LABWIRED_SCRIPT: ${{ inputs.script }}
        LABWIRED_CLI_VERSION: ${{ inputs.version }}
        LABWIRED_REPO_PRIVATE: ${{ github.event.repository.private }}
      run: python3 "${{ github.action_path }}/upload.py"

    - name: Write summary and comment
      id: summary
      shell: bash
      env:
        LABWIRED_OUTPUT_DIR: ${{ inputs.output_dir }}
        LABWIRED_REPORT_URL: ${{ steps.upload.outputs.report_url }}
        LABWIRED_COMMENT: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 "${{ github.action_path }}/comment.py"

    - name: Fail if the LabWired tests failed
      shell: bash
      run: |
        set -euo pipefail
        code="${{ steps.run.outputs.exit_code }}"
        if [ "$code" != "0" ]; then
          echo "::error::LabWired tests failed (exit code $code)."
          exit "$code"
        fi
